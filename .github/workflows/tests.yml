name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: >
          python -m pytest -q
          --cov=app --cov=lamzu --cov=updater --cov=i18n --cov=tray_visibility
          --cov-report=term-missing --cov-fail-under=55

      - name: Check sources compile
        run: >
          python -m compileall -q
          app.py lamzu.py i18n.py tray_visibility.py updater.py
          diagnose.py make_icon.py version.py tests

  rust:
    # The shipped application is the Rust build, so it gets the same gate.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust

      - name: Formatting
        working-directory: Rust
        run: cargo fmt --check

      - name: Lints
        working-directory: Rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: Rust
        run: cargo test --locked

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LamzuBattery --icon icon.ico
          --exclude-module tkinter --exclude-module numpy app.py

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\LamzuBattery.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LamzuBattery.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LamzuBattery-windows
          path: |
            dist/LamzuBattery.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
