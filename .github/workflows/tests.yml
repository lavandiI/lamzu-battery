name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check sources compile
        run: python -m py_compile app.py lamzu.py diagnose.py updater.py version.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LamzuBattery --icon icon.ico
          --exclude-module tkinter --exclude-module numpy app.py

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\LamzuBattery.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LamzuBattery.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LamzuBattery-windows
          path: |
            dist/LamzuBattery.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
