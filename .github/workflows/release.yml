name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v1.5.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LamzuBattery --icon icon.ico
          --exclude-module tkinter --exclude-module numpy app.py

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\LamzuBattery.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LamzuBattery.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $version = $tag.TrimStart("v")
          gh release create $tag `
            dist\LamzuBattery.exe `
            dist\SHA256SUMS.txt `
            --verify-tag `
            --draft `
            --title "LAMZU Battery $version" `
            --generate-notes
